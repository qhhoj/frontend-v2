<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QHHOJ</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#f6f1e7" />
    <script>
      // Pre-paint: the theme last painted when the account chose it (src/theme/theme.store.ts), else the stored
      // preference, else the OS scheme (`auto` follows today's scheme, not the last visit's). Then the personal
      // look last painted (src/theme/appearance.store.ts): accent, contrast and page background.
      // `grounds` (theme id -> its --qh-ground, for the address bar), `legacy` and the accent lists must match
      // src/theme/registry.ts, src/theme/palette/ and src/theme/appearance.ts; prepaint.spec.ts enforces it.
      var grounds = { light: '#f6f1e7', dark: '#15120f' };
      var legacy = {
        'clay-light': 'light',
        'glass-light': 'light',
        'clay-dark': 'dark',
        'glass-dark': 'dark',
        'glass-auto': 'auto',
      };
      var canonical = function (id) {
        return Object.prototype.hasOwnProperty.call(legacy, id) ? legacy[id] : id;
      };
      var known = Object.keys(grounds);
      var stored = null;
      var resolvedBy = null;
      var preference = null;
      var prefersDark = false;
      var prefersMoreContrast = false;
      try {
        stored = canonical(localStorage.getItem('qhhoj.resolvedTheme'));
        resolvedBy = localStorage.getItem('qhhoj.resolvedBy');
        preference = canonical(localStorage.getItem('qhhoj.theme'));
      } catch {}
      try {
        prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        prefersMoreContrast = matchMedia('(prefers-contrast: more)').matches;
      } catch {}
      var theme =
        resolvedBy === 'account' && known.includes(stored)
          ? stored
          : known.includes(preference)
            ? preference
            : prefersDark
              ? 'dark'
              : 'light';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', grounds[theme]);
      var accents = ['ultramarine', 'teal', 'plum', 'terracotta', 'graphite'];
      var legacyAccents = {
        clay: 'terracotta',
        orchid: 'plum',
        ocean: 'ultramarine',
        mint: 'teal',
        sunset: 'terracotta',
        gold: 'terracotta',
        mono: 'graphite',
        red: 'terracotta',
      };
      var backgrounds = [
        'none',
        'paper',
        'grainy',
        'blueprint',
        'contour',
        'halftone',
        'dither',
        'stipple',
        'landscape',
      ];
      var look = null;
      try {
        look = JSON.parse(localStorage.getItem('qhhoj.paintedAppearance'));
      } catch {
        // Blocked or malformed storage: paint the site look.
      }
      var accent =
        look && Object.prototype.hasOwnProperty.call(legacyAccents, look.accent)
          ? legacyAccents[look.accent]
          : look && look.accent;
      var validLook = accents.includes(accent);
      document.documentElement.dataset.background =
        validLook && backgrounds.includes(look.background) ? look.background : 'blueprint';
      if (validLook) document.documentElement.dataset.accent = accent;
      if (validLook ? look.contrast === 'high' : prefersMoreContrast) {
        document.documentElement.dataset.contrast = 'high';
      }
      // Low-power mode: `auto` turns on for <= 2 GB memory, <= 2 cores or Save-Data. The key, the values and the thresholds
      // must match src/theme/low-power.ts (prepaint.spec.ts enforces it). `data-low-power` is the contract every reader uses.
      var lowPowerPreference = null;
      try {
        lowPowerPreference = localStorage.getItem('qhhoj.lowPower');
      } catch {
        // Blocked storage: decide by the device.
      }
      var isAtMost = function (value, limit) {
        return typeof value === 'number' && value <= limit;
      };
      var isWeakDevice = false;
      try {
        isWeakDevice =
          isAtMost(navigator.deviceMemory, 2) ||
          isAtMost(navigator.hardwareConcurrency, 2) ||
          (navigator.connection != null && navigator.connection.saveData === true);
      } catch {
        // No navigator hints: a strong device.
      }
      if (lowPowerPreference === 'on' || (lowPowerPreference !== 'off' && isWeakDevice)) {
        document.documentElement.dataset.lowPower = '';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
