<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QHHOJ</title>
    <meta name="theme-color" content="#faf9f5" />
    <script>
      // Pre-paint: the theme last painted when the account chose it (src/theme/theme.store.ts), else the stored
      // preference, else the OS scheme (`auto` follows today's scheme, not the last visit's). Then the personal
      // look last painted (src/theme/appearance.store.ts), if every part is valid.
      // `grounds` (theme id -> its --qh-ground, for the address bar), the aliases and the fallbacks must match
      // src/theme/registry.ts and src/theme/themes/; the fallbacks are the default (first) theme of each scheme.
      // prepaint.spec.ts enforces it.
      var grounds = {
        'clay-light': '#faf9f5',
        'clay-dark': '#1a1816',
        'glass-light': '#f6f2ff',
        'glass-dark': '#0d0a1a',
      };
      var legacy = { light: 'clay-light', dark: 'clay-dark' };
      var known = Object.keys(grounds);
      var stored = null;
      var resolvedBy = null;
      var preference = null;
      var prefersDark = false;
      try {
        stored = localStorage.getItem('qhhoj.resolvedTheme');
        resolvedBy = localStorage.getItem('qhhoj.resolvedBy');
        preference = localStorage.getItem('qhhoj.theme');
      } catch {}
      try {
        prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
      } catch {}
      var scheme = prefersDark ? 'dark' : 'light';
      var theme =
        resolvedBy === 'account' && known.includes(stored)
          ? stored
          : known.includes(preference)
            ? preference
            : Object.prototype.hasOwnProperty.call(legacy, preference)
              ? legacy[preference]
              : (preference === 'glass-auto' ? 'glass-' : 'clay-') + scheme;
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', grounds[theme]);
      // `accents` must match ACCENTS in src/theme/appearance.ts; prepaint.spec.ts enforces it.
      var accents = ['clay', 'orchid', 'ocean', 'mint', 'sunset', 'gold', 'mono'];
      var look = null;
      try {
        look = JSON.parse(localStorage.getItem('qhhoj.paintedAppearance'));
      } catch {
        // Blocked or malformed storage: paint the site look.
      }
      var isPercent = function (value) {
        return Number.isInteger(value) && value >= 0 && value <= 100;
      };
      if (look && accents.includes(look.accent) && isPercent(look.glass) && isPercent(look.glow)) {
        document.documentElement.dataset.accent = look.accent;
        document.documentElement.style.setProperty('--qh-glass-level', String(look.glass));
        document.documentElement.style.setProperty('--qh-blob-strength', String(look.glow / 100));
      }
      // Low-power mode: `auto` turns on for <= 2 GB memory, <= 2 cores or Save-Data. The key, the values and the thresholds
      // must match src/theme/low-power.ts (prepaint.spec.ts enforces it). `data-low-power` is the contract every reader uses.
      var lowPowerPreference = null;
      try {
        lowPowerPreference = localStorage.getItem('qhhoj.lowPower');
      } catch {
        // Blocked storage: decide by the device.
      }
      var isAtMost = function (value, limit) {
        return typeof value === 'number' && value <= limit;
      };
      var isWeakDevice = false;
      try {
        isWeakDevice =
          isAtMost(navigator.deviceMemory, 2) ||
          isAtMost(navigator.hardwareConcurrency, 2) ||
          (navigator.connection != null && navigator.connection.saveData === true);
      } catch {
        // No navigator hints: a strong device.
      }
      if (lowPowerPreference === 'on' || (lowPowerPreference !== 'off' && isWeakDevice)) {
        document.documentElement.dataset.lowPower = '';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
