<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QHHOJ</title>
    <meta name="theme-color" />
    <script>
      // Pre-paint: the theme last painted (src/theme/theme.store.ts), else the OS scheme.
      // `known` and the fallback ids must match src/theme/registry.ts; prepaint.spec.ts enforces it.
      var known = ['glass-dark', 'glass-light'];
      var stored = null;
      var prefersLight = false;
      try {
        stored = localStorage.getItem('qhhoj.resolvedTheme');
      } catch {}
      try {
        prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
      } catch {}
      document.documentElement.dataset.theme = known.includes(stored)
        ? stored
        : prefersLight
          ? 'glass-light'
          : 'glass-dark';
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
