# Builds dist/ and deploys it with qhhoj-deploy on the production host (releases/sha-<12> + current symlink).
# The branch picks the site: main -> qhhoj.com (`qhhoj-deploy frontend`, environment production); staging ->
# staging.qhhoj.com (`qhhoj-deploy frontend-staging`, environment staging, built with VITE_STAGING=1: same api and data).
# Runs on every push to main or staging (a squash-merged PR) once CI has passed on that commit; by hand for a commit on
# the chosen target's branch, run from that branch. resolve-ref.sh refuses any other commit, and CI must have passed on it.
# Two jobs: `build` checks the commit out and builds it without any secret; `deploy` (the target's environment, which
# holds the SSH key) checks out only its branch's own commit for its scripts and ships the built artifact.
name: deploy
on:
  push: { branches: [main, staging] }
  workflow_dispatch:
    inputs:
      target:
        description: 'production (qhhoj.com, run from main) or staging (staging.qhhoj.com, run from staging)'
        type: choice
        options: [production, staging]
        default: production
      ref:
        description: "SHA or tag on the target's branch (empty: its head)"
        type: string
        default: ''
# One deploy per site at a time. A newer run replaces a pending older one; a running deploy is never cancelled.
concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      app: ${{ steps.target.outputs.app }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      # A push deploys its own branch's site; a manual run must be started from the chosen target's branch.
      - name: Target from the branch
        id: target
        env:
          TARGET: "${{ inputs.target || (github.ref == 'refs/heads/staging' && 'staging' || 'production') }}"
        run: |
          case "$TARGET" in
            production) branch=main app=frontend staging= ;;
            staging) branch=staging app=frontend-staging staging=1 ;;
            *) echo "unknown target $TARGET" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$branch" || { echo "a $TARGET deploy runs from $branch, not $GITHUB_REF" >&2; exit 1; }
          { echo "branch=$branch"; echo "app=$app"; echo "environment=$TARGET"; echo "staging=$staging"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: ref
        env:
          REF: '${{ inputs.ref || github.sha }}'
          DEPLOY_BRANCH: '${{ steps.target.outputs.branch }}'
        run: bash scripts/deploy/resolve-ref.sh "$REF" >> "$GITHUB_OUTPUT"
      - name: Wait for CI on this commit
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ steps.ref.outputs.sha }}' }
        run: bash scripts/deploy/wait-for-ci.sh "$SHA" ci.yml 120
      - env: { SHA: '${{ steps.ref.outputs.sha }}' }
        run: git checkout --detach "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      # No dependency install script runs (none is needed for the build).
      - run: npm ci --ignore-scripts
      # VITE_STAGING=1 shows the "Staging" banner (src/features/shell/StagingBanner.vue); empty on production.
      - run: npm run build
        env:
          GIT_SHA: '${{ steps.ref.outputs.sha }}'
          VITE_STAGING: '${{ steps.target.outputs.staging }}'
      # The tarball name carries the qhhoj-deploy app: <app>-dist-<tag>.tar.gz.
      - name: Package
        env: { TAG: '${{ steps.ref.outputs.tag }}', APP: '${{ steps.target.outputs.app }}' }
        run: |
          tar -czf "$APP-dist-$TAG.tar.gz" -C dist .
          sha256sum "$APP-dist-$TAG.tar.gz" > "$APP-dist-$TAG.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: ${{ steps.target.outputs.app }}-dist-*.tar.gz*
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 380
    environment: ${{ needs.build.outputs.environment }}
    steps:
      # the branch's own commit (github.sha), never the deploy target: only that branch's scripts see the key
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: '${{ github.sha }}' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: frontend-dist }
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      # rsync, not scp (SFTP on OpenSSH 9): the host's dispatcher (backend-v2 deploy/qhhoj-deploy-serve) accepts only
      # `sudo qhhoj-deploy ...` and a write-only rsync to exactly this incoming path.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
          APP: ${{ needs.build.outputs.app }}
        run: |
          rsync "$APP-dist-$TAG.tar.gz" "$APP-dist-$TAG.tar.gz.sha256" "deploy@$DEPLOY_HOST:/var/lib/qhhoj-deploy/incoming/"
          bash scripts/deploy/remote-deploy.sh "$APP" "$TAG"
