name: API drift

# The snapshot in src/api/generated must be the document the DEPLOYED backend serves: its latest GitHub release
# (the backend deploys only on a release; backend main may hold unreleased changes the live API would refuse).
# Red here means: check out the backend release tag, run `npm run api:gen`, fix the typecheck, open a
# `chore: sync api schema` PR. A PR that needs unreleased backend changes waits for that release.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: latest backend release
        id: release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: echo "tag=$(gh api repos/qhhoj/backend-v2/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: qhhoj/backend-v2
          ref: ${{ steps.release.outputs.tag }}
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: backend checkout has the contract
        run: test -f backend/openapi.json
      - name: snapshot equals the latest backend release
        env: { TAG: '${{ steps.release.outputs.tag }}' }
        run: |
          echo "snapshot taken from backend $(cat src/api/generated/openapi.source); latest release $TAG is $(git -C backend rev-parse HEAD)"
          OPENAPI_SPEC=backend/openapi.json npm run api:check -- --backend || {
            echo "::error::src/api/generated is not backend release $TAG. If this PR needs backend changes not yet released, merge it after the backend release that contains them is deployed. Otherwise check out $TAG in ../backend-v2, run npm run api:gen and commit."
            exit 1
          }
