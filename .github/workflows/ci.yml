name: CI

on:
  # main deploys qhhoj.com, staging deploys staging.qhhoj.com (deploy.yml): both are checked the same way.
  push:
    branches: [main, staging]
  pull_request: { branches: [main, staging] }
  # Merge queue: the same checks on the queued merge commit, against the queue's base.
  merge_group: { branches: [main, staging] }
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# Third-party actions are pinned by commit SHA (the comment names the tag). `npm ci --ignore-scripts`: no dependency's
# install script runs (none is needed: vue-demi's postinstall only re-selects the Vue 3 build it ships by default).
env:
  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
  # Pull requests and the merge queue check only what the diff touches; main, the nightly run and manual runs check everything.
  DIFF_ONLY: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  # Pushes that touch only docs or deploy scripts skip the heavy jobs below; a skipped job counts as a
  # pass, so the run (and the deploy gate waiting on it) stays green. scripts always runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          CI_LIGHT_PATHS: '^(.*[.]md|docs/.*|scripts/deploy/.*)$'
        run: bash scripts/deploy/code-changed.sh "$BASE" >> "$GITHUB_OUTPUT"

  # Deploy-script tests, always.
  scripts:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/deploy/ci-scripts.test.sh

  # lint, typecheck and test run in parallel; each skips (a pass) on docs-only pushes.
  # ESLint and Prettier: only the changed files on pull requests and in the merge queue (both judge one file at a time;
  # a tooling or scripts/ change lints everything, see scripts/lint-changed.sh), everything on main and nightly.
  # Four parallel shards: each lints every fourth file (type-aware ESLint is the slow part); shard 1 also runs Prettier.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: ${{ env.DIFF_ONLY != 'true' && 1 || 0 }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - env:
          LINT_SHARD: ${{ matrix.shard }}/4
        run: bash scripts/lint-changed.sh "$([ "$DIFF_ONLY" = true ] && echo "$BASE")"

  # The repo's own lint rules (lint:tokens, palette, copy, dates, plan-codes), in parallel with ESLint.
  lint-rules:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:rules

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run api:check
      # vue-tsc --build is incremental: the newest build info for these dependencies and configs skips unchanged files.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tsbuild
          key: tsbuild-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: tsbuild-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
      - run: npm run typecheck

  # The unit tests (time, score and rating math, verdict mapping, the submit path): one runner, all specs.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # Contract with backend-v2: every inline script of the built index.html (what deploys) has its hash in the CSP of
  # backend main's deploy/nginx/qhhoj.conf. A changed pre-paint script needs its hash merged there first.
  csp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vite build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: qhhoj/backend-v2
          ref: main
          path: backend
          sparse-checkout: deploy/nginx
      - run: node scripts/deploy/check-csp-hash.mjs dist/index.html backend/deploy/nginx/qhhoj.conf

  # The required status check: green when lint, lint-rules, typecheck, test and csp passed or were skipped.
  check:
    needs: [changes, lint, lint-rules, typecheck, test, csp]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
