name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full unit suite; pull requests run only the tests affected by the diff.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# Third-party actions are pinned by commit SHA (the comment names the tag). `npm ci --ignore-scripts`: no dependency's
# install script runs (none is needed: vue-demi's postinstall only re-selects the Vue 3 build it ships by default).
env:
  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  # Pushes that touch only docs or deploy scripts skip the heavy jobs below; a skipped job counts as a
  # pass, so the run (and the deploy gate waiting on it) stays green. scripts always runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      scripts: ${{ steps.scripts.outputs.scripts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          CI_LIGHT_PATHS: '^(.*[.]md|docs/.*|scripts/deploy/.*)$'
        run: bash scripts/deploy/code-changed.sh "$BASE" >> "$GITHUB_OUTPUT"
      # scripts=true when scripts/ changed (or the base is unknown): only then do the CLI specs run.
      - id: scripts
        run: |
          if [ -z "$BASE" ] || [[ $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE" HEAD -- scripts | grep -q .; then
            echo scripts=true >> "$GITHUB_OUTPUT"
          else
            echo scripts=false >> "$GITHUB_OUTPUT"
          fi

  # Deploy-script tests always; the api-gen and build-script specs (slow: each spawns node) only when scripts/ changed.
  scripts:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/deploy/ci-scripts.test.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.scripts == 'true'
        with:
          node-version: 22
          cache: npm
      - if: needs.changes.outputs.scripts == 'true'
        run: npm ci --ignore-scripts && npm run test:scripts

  # lint, typecheck and test run in parallel; each skips (a pass) on docs-only pushes.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run api:check
      # vue-tsc --build is incremental: the newest build info for these dependencies and configs skips unchanged files.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tsbuild
          key: tsbuild-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: tsbuild-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
      - run: npm run typecheck

  # Pull requests: one runner, only specs whose import graph touches a file changed since the base. Pushes to main,
  # the nightly run and manual runs: the full suite in three shards.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          if [ -n "$BASE_SHA" ]; then npm test -- --changed "$BASE_SHA" --passWithNoTests && npm run test:scanners; else npm test -- --shard="$SHARD"; fi

  # Contract with backend-v2: every inline script of the built index.html (what deploys) has its hash in the CSP of
  # backend main's deploy/nginx/qhhoj.conf. A changed pre-paint script needs its hash merged there first.
  csp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vite build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: qhhoj/backend-v2
          ref: main
          path: backend
          sparse-checkout: deploy/nginx
      - run: node scripts/deploy/check-csp-hash.mjs dist/index.html backend/deploy/nginx/qhhoj.conf

  # The required status check: green when lint, typecheck, test and csp passed or were skipped.
  check:
    needs: [changes, lint, typecheck, test, csp]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
